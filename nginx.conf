server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://ai-infra-platform-api.ai-platform.svc.cluster.local:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://ai-infra-platform-api.ai-platform.svc.cluster.local:8000/healthz;
    }

    location = /readyz {
        proxy_pass http://ai-infra-platform-api.ai-platform.svc.cluster.local:8000/readyz;
    }

    location = /openapi.json {
        proxy_pass http://ai-infra-platform-api.ai-platform.svc.cluster.local:8000/openapi.json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
